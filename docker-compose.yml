services:
  db:
    image: postgres:16-alpine
    container_name: placement_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placement}
      POSTGRES_DB: ${POSTGRES_DB:-placement_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - placement_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placement} -d ${POSTGRES_DB:-placement_assistant}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  placement_pgdata:
